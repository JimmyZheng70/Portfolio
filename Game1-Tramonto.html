<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tramonto - James Zheng</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
	    <a class="brand" href="HomePage.html">James Zheng</a>
		<nav aria-label="Main navigation">
			<a href="About.html">About</a>
            <a href="Portfolio.html">Projects</a>
			<a href="Contact.html">Contact</a>
        </nav>
	</header>
	<main>
		<h1>Tramonto</h1>
		<section class="synopsis-layout" aria-labelledby="synopsis-heading">
			<div>
				<h2 id="synopsis-heading">Synopsis</h2>
				<p>Something Something, about the game. Will remove later.</p>
			</div>
			<div class="video-player">
				<video controls playsinline aria-label="Tramonto gameplay video">
					Your browser does not support HTML video.
				</video>
			</div>
		</section>
		<h2>Screenshots</h2>

		<div class="screenshot-gallery" aria-label="Tramonto screenshots">
			<button class="screenshot-button" type="button" data-image="Images/Game/Game1-Tramonto.jpg" aria-label="View Tramonto screenshot larger">
				<img src="Images/Game/Game1-Tramonto.jpg" alt="Tramonto game preview">
			</button>
		</div>
		<dialog class="screenshot-dialog" id="screenshot-dialog">
			<button class="close-screenshot" type="button" aria-label="Close screenshot">×</button>
			<img class="screenshot-preview" src="Images/Game/Game1-Tramonto.jpg" alt="Tramonto screenshot enlarged">
		</dialog>

        <h2>Background</h2>
		<p>Background Information About the Game.</p>
		<h2>Link To Game:</h2>
		<a href="https://puffinglaze.itch.io/tramonto-demo">https://puffinglaze.itch.io/tramonto-demo</a>
	</main>
	<script>
		const screenshotButton = document.querySelector('.screenshot-button');
		const screenshotDialog = document.querySelector('.screenshot-dialog');
		const screenshotPreview = document.querySelector('.screenshot-preview');
		const closeScreenshot = document.querySelector('.close-screenshot');

		screenshotButton.addEventListener('click', () => {
			screenshotPreview.src = screenshotButton.dataset.image;
			screenshotPreview.alt = 'Tramonto screenshot enlarged';
			screenshotDialog.showModal();
		});
		closeScreenshot.addEventListener('click', () => screenshotDialog.close());

		screenshotDialog.addEventListener('click', (event) => {
			if (event.target === screenshotDialog) {
				screenshotDialog.close();
			}
		});
	</script>
</body>
</html>
