<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Threadrunner - James Zheng</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
	    <a>James Zheng</a>
		<nav aria-label="Main navigation">
			<a href="About.html">About</a>
            <a href="Portfolio.html">Projects</a>
			<a href="Contact.html">Contact</a>
        </nav>
	</header>
	<main>
		<h1>Tramonto</h1>
		<section class="synopsis-layout" aria-labelledby="synopsis-heading">
			<div>
				<h2 id="synopsis-heading">Synopsis</h2>
				<p>A horror/puzzle point-and-click game in which the player must find 3 clues from different scenes to unlock the chest.</p>
			</div>
			<div class="video-player">
				<video controls playsinline preload="metadata" aria-label="Tramonto Gameplay Video">
					<source src="Videos/Threadrunner.mp4" type="video/mp4">
				</video>
			</div>
		</section>
		<h2>Collaborated With:</h2>
		<p>Ilyas Khan - Main Programming, Gameplay Design, Music</p>
		<p>En bui - Art</p>
		<h2>Screenshots</h2>
		<div class="screenshot-gallery" aria-label="Treadrunner screenshots">
			<button class="screenshot-button" type="button" data-image="Images/Game/Threadrunner-1.png" aria-label="View Threadrunner screenshot 1 larger">
				<img src="Images/Game/Threadrunner-1.png" alt="Threadrunner screenshot 1">
			</button>
			<button class="screenshot-button" type="button" data-image="Images/Game/Threadrunner-2.png" aria-label="View Threadrunner screenshot 2 larger">
				<img src="Images/Game/Threadrunner-2.png" alt="Threadrunner screenshot 2">
			</button>
			<button class="screenshot-button" type="button" data-image="Images/Game/Threadrunner-3.png" aria-label="View Threadrunner screenshot 3 larger">
				<img src="Images/Game/Threadrunner-3.png" alt="Threadrunner screenshot 3">
			</button>
			<button class="screenshot-button" type="button" data-image="Images/Game/Threadrunner-4.png" aria-label="View Threadrunner screenshot 4 larger">
				<img src="Images/Game/Threadrunner-4.png" alt="Threadrunner screenshot 4">
			</button>
		</div>
		<dialog class="screenshot-dialog" id="screenshot-dialog" aria-label="Enlarged Threadrunner screenshot">
			<button class="close-screenshot" type="button" aria-label="Close screenshot">×</button>
			<img class="screenshot-preview" alt="Enlarged Threadrunner screenshot">
		</dialog>

        <h2>Background</h2>
		<p></p>
	</main>
	<script src="screenshot-gallery.js"></script>
</body>
</html>
